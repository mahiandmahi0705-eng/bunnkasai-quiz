<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5f5f5;
  text-align: center;
}
.container {
  max-width: 700px;
  margin: auto;
  padding: 30px 20px;
}
h1 { font-size: 36px; margin-top: 50px; }
h2 { margin-top: 30px; }
p { font-size: 18px; line-height: 1.8; }
.box {
  background: white;
  padding: 25px;
  margin-top: 30px;
  border-radius: 15px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.1);
  text-align: left;
}
button {
  padding: 12px 25px;
  margin: 15px 5px;
  font-size: 18px;
  border: none;
  border-radius: 10px;
  background: #333;
  color: white;
  cursor: pointer;
}
.message {
  font-size: 20px;
  font-weight: bold;
  margin-top: 15px;
  text-align: center;
}
.choice {
  display: none;
  background: #eef7ff;
  padding: 15px;
  margin-top: 20px;
  border-radius: 10px;
  text-align: center;
  line-height: 1.7;
}
.counter {
  font-size: 20px;
  font-weight: bold;
  text-align: center;
  margin: 15px 0;
}
#quiz, #challenge, #question2, #complete { display: none; }

.graph {
  position: relative;
  width: 100%;
  max-width: 600px;
  margin: 20px auto;
  line-height: 0;
}
.graph img {
  display: block;
  width: 100%;
  height: auto;
  border: 2px solid #333;
}
.graph svg {
  position: absolute;
  left: 0;
  top: 0;
  width: 100%;
  height: 100%;
}
.tap-point {
  fill: transparent;
  stroke: transparent;
  cursor: pointer;
}
.found-point {
  fill: rgba(0,160,80,.25);
  stroke: #00a050;
  stroke-width: 2;
}
.correct-effect {
  position: fixed;
  top: 40%;
  left: 50%;
  transform: translate(-50%,-50%);
  font-size: 42px;
  font-weight: bold;
  z-index: 1000;
  animation: pop .8s ease;
  pointer-events: none;
}
@keyframes pop {
0% { transform: translate(-50%,-50%) scale(.3); opacity:0; }
50% { transform: translate(-50%,-50%) scale(1.3); opacity:1; }
100% { transform: translate(-50%,-50%) scale(1); opacity:0; }
}
.confetti {
  position: fixed;
  width: 10px;
  height: 18px;
  top: -20px;
  z-index: 9999;
  pointer-events: none;
  animation: fall 2.5s linear forwards;
}
@keyframes fall {
  to { transform: translateY(110vh) rotate(720deg); }
}
</style>

<!-- （2） -->
<div id="question2">
<h3>（2）</h3>
<p>ここに第2問（2）の問題文を入れます。</p>
<p>
  Ans:
  <input type="number" id="answer2"
    style="width:150px;padding:10px;font-size:22px;text-align:center;border:2px solid #aaa;border-radius:8px;">
</p>
<button onclick="checkAnswer2()">答える</button>
<div id="message2" class="message"></div>
</div>

</div>

<!-- クリア -->
<div id="complete" class="box">
<h2>🎉 第2問クリア！</h2>
<p>おめでとう！</p>
</div>

</div>

<script>
let found = [];

function startQuiz() {
  document.getElementById("start").style.display = "none";
  document.getElementById("quiz").style.display = "block";
}

function tapAnswer(index, element) {
  if (found.includes(index)) {
    document.getElementById("message1").textContent = "⭐ この点はもう見つけたよ！";
    return;
  }

  found.push(index);
  element.classList.add("found-point");

  document.getElementById("message1").textContent =
    "🎉 正解！この点も正解です！";
  document.getElementById("message1").style.color = "green";

  celebrate();

  setTimeout(function() {
    document.getElementById("choice").style.display = "block";
    document.getElementById("choice").scrollIntoView({behavior:"smooth"});
  }, 700);
}

function startChallenge() {
  document.getElementById("question1").style.display = "none";
  document.getElementById("challenge").style.display = "block";
  document.getElementById("counter").textContent =
    found.length + " / 4 点 発見";
  document.getElementById("challenge").scrollIntoView({behavior:"smooth"});
}

function tapChallenge(index, element) {
  if (found.includes(index)) {
    document.getElementById("challengeMessage").textContent =
      "⭐ この点はもう見つけたよ！";
    return;
  }

  found.push(index);
  element.classList.add("found-point");

  document.getElementById("counter").textContent =
    found.length + " / 4 点 発見";

  celebrate();

  if (found.length === 4) {
    document.getElementById("challengeMessage").textContent =
      "🏆 Challenge Complete！4つ全部見つけた！";
    document.getElementById("challengeMessage").style.color = "green";
    document.getElementById("challengeNext").style.display = "inline-block";
  } else {
    document.getElementById("challengeMessage").textContent =
      "🎉 発見！あと " + (4 - found.length) + " 点！";
    document.getElementById("challengeMessage").style.color = "green";
  }
}

function goToQuestion2() {
  document.getElementById("question1").style.display = "none";
  document.getElementById("challenge").style.display = "none";
  document.getElementById("question2").style.display = "block";
  document.getElementById("question2").scrollIntoView({behavior:"smooth"});
}

function checkAnswer2() {
  const answer = Number(document.getElementById("answer2").value);
  const message = document.getElementById("message2");

  // ★あとで第2問（2）の正解に変更
  if (answer === 12) {
    message.textContent = "🎉 正解！";
    message.style.color = "green";
    celebrate();

    setTimeout(function() {
      document.getElementById("complete").style.display = "block";
      document.getElementById("complete").scrollIntoView({behavior:"smooth"});
    }, 1200);
  } else {
    message.textContent = "もう一度考えてみよう！";
    message.style.color = "red";
  }
}

function celebrate() {
  for (let i=0; i<50; i++) {
    const c = document.createElement("div");
    c.className = "confetti";
    const colors = ["red","blue","green","gold","hotpink"];
    c.style.background = colors[Math.floor(Math.random()*colors.length)];
    c.style.left = Math.random()*100 + "vw";
    c.style.animationDelay = Math.random()*0.5 + "s";
    document.body.appendChild(c);
    setTimeout(function() { c.remove(); }, 3000);
  }
}
</script>
