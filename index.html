<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>文化祭クイズ</title>
<style>
   body {
     margin: 0;
     font-family: sans-serif;
     background: #f5f5f5;
     text-align: center;
   }
   .container {
     max-width: 600px;
     margin: 0 auto;
     padding: 40px 20px;
   }
   h1 {
     font-size: 36px;
     margin-top: 80px;
   }
   p {
     font-size: 20px;
     line-height: 1.8;
}
   button {
     font-size: 22px;
     padding: 15px 50px;
     border: none;
     border-radius: 12px;
     cursor: pointer;
     background: #333;
     color: white;
   }
   button:hover {
     opacity: 0.8;
   }
</style>
</head>
<body>
<div class="container">
<h1>文化祭クイズ</h1>
<p>
     QRコードを読み取ってくれて<br>
     ありがとうございます！
</p>
<p>
     それでは、クイズに挑戦しよう！
</p>
<button onclick="startQuiz()">スタート</button>
</div>
<script>
   function startQuiz() {
     alert("クイズスタート！");
   }
</script>
</body>
</html>
