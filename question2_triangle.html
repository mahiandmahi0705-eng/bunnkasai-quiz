<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ＰＳＬＥに挑戦！ 第2問</title>
<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5f5f5;
  text-align: center;
}
.container {
  max-width: 700px;
  margin: auto;
  padding: 30px 20px;
}
h1 { font-size: 36px; margin-top: 50px; }
h2 { margin-top: 30px; }
p { font-size: 18px; line-height: 1.8; }
.box {
  background: white;
  padding: 25px;
  margin-top: 30px;
  border-radius: 15px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.1);
  text-align: left;
}
button {
  padding: 12px 25px;
  margin: 15px 5px;
  font-size: 18px;
  border: none;
  border-radius: 10px;
  background: #333;
  color: white;
  cursor: pointer;
}
.message {
  font-size: 20px;
  font-weight: bold;
  margin-top: 15px;
  text-align: center;
}
.choice {
  display: none;
  background: #eef7ff;
  padding: 15px;
  margin-top: 20px;
  border-radius: 10px;
  text-align: center;
  line-height: 1.7;
}
.counter {
  font-size: 20px;
  font-weight: bold;
  text-align: center;
  margin: 15px 0;
}
#quiz, #challenge, #question2, #complete { display: none; }

.graph {
  position: relative;
  width: 100%;
  max-width: 600px;
  margin: 20px auto;
  line-height: 0;
}
.graph img {
  display: block;
  width: 100%;
  height: auto;
  border: none;
}
.graph svg {
  position: absolute;
  left: 0;
  top: 0;
  width: 100%;
  height: 100%;
}
.tap-point {
  fill: transparent;
  stroke: transparent;
  cursor: pointer;
}
.selected-point {
  fill: rgba(0,160,80,.28);
  stroke: #00a050;
  stroke-width: 4;
}
.triangle-line {
  stroke: #00a050;
  stroke-width: 5;
  stroke-linecap: round;
  pointer-events: none;
}
.confetti {
  position: fixed;
  width: 10px;
  height: 18px;
  top: -20px;
  z-index: 9999;
  pointer-events: none;
  animation: fall 2.5s linear forwards;
}
@keyframes fall {
  to { transform: translateY(110vh) rotate(720deg); }
}
</style>
</head>
<body>

<div class="container">

<!-- スタート画面 -->
<div id="start">
  <h1>ＰＳＬＥに挑戦</h1>
  <p>数学の問題に挑戦しよう！</p>
  <h2>第2問</h2>
  <button onclick="startQuiz()">スタート</button>
</div>

<!-- クイズ -->
<div id="quiz">
<div class="box">

<h2>第2問</h2>

<!-- （1） -->
<div id="question1">
<h3>（1）</h3>
<p>線分ABと三角形をつくる点Cとして、正しい点を1つタップしてください。</p>
<p><strong>正解は4つあります。</strong></p>

<div id="graph1" class="graph">
  <img src="question2.PNG" alt="座標平面上の線分AB">

  <svg viewBox="0 0 1295 1214" preserveAspectRatio="none">
    <!-- A(5,8) と B(2,4) から、選んだCへ伸びる線 -->
    <line id="lineA1" class="triangle-line" x1="638" y1="118" x2="638" y2="118" style="display:none;"></line>
    <line id="lineB1" class="triangle-line" x1="251" y1="646" x2="251" y2="646" style="display:none;"></line>

    <!-- 正解4点 -->
    <!-- C(5,4) -->
    <circle class="tap-point" cx="638" cy="646" r="32"
      onclick="tapAnswer(0,638,646,this)"></circle>

    <!-- C(2,6) -->
    <circle class="tap-point" cx="251" cy="381" r="32"
      onclick="tapAnswer(1,251,381,this)"></circle>

    <!-- C(6,2) -->
    <circle class="tap-point" cx="767" cy="909" r="32"
      onclick="tapAnswer(2,767,909,this)"></circle>

    <!-- C(3,7) -->
    <circle class="tap-point" cx="380" cy="249" r="32"
      onclick="tapAnswer(3,380,249,this)"></circle>
  </svg>
</div>

<div id="message1" class="message"></div>

<div id="choice" class="choice">
  🔎 <strong>Challenge！</strong><br>
  実は、正解の点は全部で4つあります。<br>
  他の3つも探してみる？
  <br>
  <button onclick="startChallenge()">もっと探す！</button>
  <button onclick="goToQuestion2()">（2）へ進む</button>
</div>
</div>

<!-- Challenge -->
<div id="challenge">
<h3>🔎 Challenge！</h3>
<p>残りの正解点を探して、4つ全部見つけよう！</p>
<div id="counter" class="counter">1 / 4 点 発見</div>

<div id="graphChallenge" class="graph">
  <img src="question2.PNG" alt="座標平面上の線分AB">

  <svg viewBox="0 0 1295 1214" preserveAspectRatio="none">
    <line id="lineA2" class="triangle-line" x1="638" y1="118" x2="638" y2="118" style="display:none;"></line>
    <line id="lineB2" class="triangle-line" x1="251" y1="646" x2="251" y2="646" style="display:none;"></line>

    <circle class="tap-point" cx="638" cy="646" r="32"
      onclick="tapChallenge(0,638,646,this)"></circle>

    <circle class="tap-point" cx="251" cy="381" r="32"
      onclick="tapChallenge(1,251,381,this)"></circle>

    <circle class="tap-point" cx="767" cy="909" r="32"
      onclick="tapChallenge(2,767,909,this)"></circle>

    <circle class="tap-point" cx="380" cy="249" r="32"
      onclick="tapChallenge(3,380,249,this)"></circle>
  </svg>
</div>

<div id="challengeMessage" class="message"></div>
<div style="text-align:center;">
  <button id="challengeNext" onclick="goToQuestion2()" style="display:none;">
    （2）へ進む
  </button>
</div>
</div>

<!-- （2） -->
<div id="question2">
<h3>（2）</h3>
<p>ここに第2問（2）の問題文を入れます。</p>
<p>
  Ans:
  <input type="number" id="answer2"
    style="width:150px;padding:10px;font-size:22px;text-align:center;border:2px solid #aaa;border-radius:8px;">
</p>
<button onclick="checkAnswer2()">答える</button>
<div id="message2" class="message"></div>
</div>

</div>

<!-- クリア -->
<div id="complete" class="box">
<h2>🎉 第2問クリア！</h2>
<p>おめでとう！</p>
</div>

</div>

<script>
let found = [];

function startQuiz() {
  document.getElementById("start").style.display = "none";
  document.getElementById("quiz").style.display = "block";
}

function drawTriangle(lineAId, lineBId, x, y) {
  const lineA = document.getElementById(lineAId);
  const lineB = document.getElementById(lineBId);

  lineA.setAttribute("x2", x);
  lineA.setAttribute("y2", y);
  lineB.setAttribute("x2", x);
  lineB.setAttribute("y2", y);

  lineA.style.display = "block";
  lineB.style.display = "block";
}

function clearSelectedPoints(graphId) {
  document.querySelectorAll("#" + graphId + " .tap-point").forEach(function(point) {
    point.classList.remove("selected-point");
  });
}

function tapAnswer(index, x, y, element) {
  if (!found.includes(index)) {
    found.push(index);
  }

  clearSelectedPoints("graph1");
  element.classList.add("selected-point");

  // A(5,8)→C と B(2,4)→C を表示
  drawTriangle("lineA1", "lineB1", x, y);

  document.getElementById("message1").textContent =
    "🎉 正解！A・Bと結ぶと三角形ができました！";
  document.getElementById("message1").style.color = "green";

  celebrate();

  setTimeout(function() {
    document.getElementById("choice").style.display = "block";
    document.getElementById("choice").scrollIntoView({behavior:"smooth"});
  }, 700);
}

function startChallenge() {
  document.getElementById("question1").style.display = "none";
  document.getElementById("challenge").style.display = "block";
  document.getElementById("counter").textContent =
    found.length + " / 4 点 発見";
  document.getElementById("challenge").scrollIntoView({behavior:"smooth"});
}

function tapChallenge(index, x, y, element) {
  clearSelectedPoints("graphChallenge");
  element.classList.add("selected-point");

  // Challengeでも、今タップしたCに向かってA・Bから線を表示
  drawTriangle("lineA2", "lineB2", x, y);

  if (found.includes(index)) {
    document.getElementById("challengeMessage").textContent =
      "⭐ この点はもう見つけたよ！";
    document.getElementById("challengeMessage").style.color = "#555";
    return;
  }

  found.push(index);

  document.getElementById("counter").textContent =
    found.length + " / 4 点 発見";

  celebrate();

  if (found.length === 4) {
    document.getElementById("challengeMessage").textContent =
      "🏆 Challenge Complete！4つ全部見つけた！";
    document.getElementById("challengeMessage").style.color = "green";
    document.getElementById("challengeNext").style.display = "inline-block";
  } else {
    document.getElementById("challengeMessage").textContent =
      "🎉 発見！あと " + (4 - found.length) + " 点！";
    document.getElementById("challengeMessage").style.color = "green";
  }
}

function goToQuestion2() {
  document.getElementById("question1").style.display = "none";
  document.getElementById("challenge").style.display = "none";
  document.getElementById("question2").style.display = "block";
  document.getElementById("question2").scrollIntoView({behavior:"smooth"});
}

function checkAnswer2() {
  const answer = Number(document.getElementById("answer2").value);
  const message = document.getElementById("message2");

  // ★あとで第2問（2）の正解に変更
  if (answer === 12) {
    message.textContent = "🎉 正解！";
    message.style.color = "green";
    celebrate();

    setTimeout(function() {
      document.getElementById("complete").style.display = "block";
      document.getElementById("complete").scrollIntoView({behavior:"smooth"});
    }, 1200);
  } else {
    message.textContent = "もう一度考えてみよう！";
    message.style.color = "red";
  }
}

function celebrate() {
  for (let i=0; i<50; i++) {
    const c = document.createElement("div");
    c.className = "confetti";
    const colors = ["red","blue","green","gold","hotpink"];
    c.style.background = colors[Math.floor(Math.random()*colors.length)];
    c.style.left = Math.random()*100 + "vw";
    c.style.animationDelay = Math.random()*0.5 + "s";
    document.body.appendChild(c);
    setTimeout(function() { c.remove(); }, 3000);
  }
}
</script>

</body>
</html>
